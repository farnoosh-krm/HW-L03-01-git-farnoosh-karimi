<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>store</title>

    <link rel="stylesheet" href="./style/productStyle.css">
</head>

<body>

    <h1>Product Management System</h1>
    <hr>
    <h2>Product List</h2>
    <input type="text" placeholder="search..." id="search-input" oninput="debounceSearch()">

    <select name="selectCategory" id="selectCategory" onchange="filterByCategory()">
        <option value="">loading category</option>
    </select>

    <input class="price" type="number" id="minPrice" placeholder="min price..">
    <input class="price" type="number" id="priceFilter" placeholder="max price..">
    <button id="filterbtn" onclick="filterByPrice()">filter</button>


    <div id="loadingProduct">loading product</div>

    <div id="productList"></div>

    <hr>

    <h2>Similar Product</h2>
    

    <div id="similarProducts"></div>




    <script src="./script/productScript.js"></script>

</body>

</html>
